# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and test sources
        run: make hook test preflight


  arm-hook:
    name: Build ARM runtime hook
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file

      - name: Compile firmware 1.19 hook
        run: make hook FIRMWARE=1.19

      - name: Upload ARM runtime hook
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: build/librx3_core.so
          if-no-files-found: error


  usb-wifi-artifacts:
    name: Build USB Wi-Fi runtime artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: Fetch the published RX3 kernel source
        run: make kernel-source FIRMWARE=1.19

      - name: Build the pinned toolchain images
        run: |
          make kernel-builder
          docker build \
            --file tools/rx3_usb_wifi_userspace/Containerfile \
            --tag rx3-usb-wifi-builder:bookworm \
            tools/rx3_usb_wifi_userspace

      - name: Build USB Wi-Fi userspace
        run: |
          tools/rx3_usb_wifi_userspace/fetch-sources.sh \
            build/usb-wifi-sources
          mod/modules/usb-wifi/1.19/profiles/edimax-ew-7811un-v1/fetch-sources.sh \
            build/usb-wifi-sources
          tools/rx3_usb_wifi_userspace/build.sh \
            edimax-ew-7811un-v1 build/usb-wifi-sources
          tools/rx3_usb_wifi_userspace/build.sh \
            tp-link-archer-t3u-v1 build/usb-wifi-sources

      - name: Build USB Wi-Fi kernel modules
        run: |
          make kernel-modules \
            MODULE=usb-wifi \
            PROFILE=edimax-ew-7811un-v1 \
            FIRMWARE=1.19 \
            KERNEL_SOURCE=build/kernel-source/1.19
          make kernel-modules \
            MODULE=usb-wifi \
            PROFILE=tp-link-archer-t3u-v1 \
            FIRMWARE=1.19 \
            KERNEL_SOURCE=build/kernel-source/1.19

      - name: Verify every declared artifact exists
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("build/artifacts/1.19/usb-wifi/edimax-ew-7811un-v1")
          required = {
              "profile.json", "usb.ids", "modules.load", "firmware.list",
              "supplicant.driver", "wpa_supplicant", "wpa_cli", "rx3-ifrename",
              "compat-average.ko", "cfg80211.ko", "mac80211.ko", "rtlwifi.ko",
              "rtl8192c-common.ko", "rtl8192cu.ko", "rtlwifi/rtl8192cufw.bin",
              "LICENCE.rtlwifi_firmware.txt",
          }
          missing = sorted(root / path for path in required if not (root / path).is_file())
          if missing:
              raise SystemExit("missing artifacts: " + ", ".join(map(str, missing)))

          root = Path("build/artifacts/1.19/usb-wifi/tp-link-archer-t3u-v1")
          required = {
              "profile.json", "usb.ids", "modules.load", "firmware.list",
              "supplicant.driver", "wpa_supplicant", "wpa_cli", "rx3-ifrename",
              "compat-average.ko", "cfg80211.ko", "88x2bu.ko",
          }
          missing = sorted(root / path for path in required if not (root / path).is_file())
          if missing:
              raise SystemExit("missing artifacts: " + ", ".join(map(str, missing)))
          PY

      - name: Upload USB Wi-Fi runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-usb-wifi
          path: build/artifacts/1.19/usb-wifi
          if-no-files-found: error


  dropbear:
    name: Build RX3 SSH runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install container build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build and test Dropbear
        run: make dropbear

      - name: Upload Dropbear runtime
        uses: actions/upload-artifact@v4
        with:
          name: runtime-assets-dropbear
          path: build/artifacts/1.19/rx3-ssh/dropbearmulti
          if-no-files-found: error


  desktop-app:
    name: Desktop app (${{ matrix.platform }})
    needs:
      - source
      - arm-hook
      - usb-wifi-artifacts
      - dropbear

    strategy:
      fail-fast: false

      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux x64
            artifact: xdj-rx3-toolkit-linux-x64
            target: dist/XDJ-RX3 Toolkit
            executable: dist/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-Linux-x64.tar.gz

          - runner: windows-2025
            platform: Windows x64
            artifact: xdj-rx3-toolkit-windows-x64
            target: dist/XDJ-RX3 Toolkit.exe
            executable: dist/XDJ-RX3 Toolkit.exe
            archive: XDJ-RX3-Toolkit-Windows-x64.zip

          - runner: macos-15-intel
            platform: macOS Intel
            artifact: xdj-rx3-toolkit-macos-intel
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Intel.zip

          - runner: macos-latest
            platform: macOS Apple Silicon
            artifact: xdj-rx3-toolkit-macos-apple-silicon
            target: dist/XDJ-RX3 Toolkit.app
            executable: dist/XDJ-RX3 Toolkit.app/Contents/MacOS/XDJ-RX3 Toolkit
            archive: XDJ-RX3-Toolkit-macOS-Apple-Silicon.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Download ARM runtime hook
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets-arm-hook
          path: prebuilt

      - name: Download USB Wi-Fi runtime artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets-usb-wifi
          path: build/artifacts/1.19/usb-wifi

      - name: Download Dropbear runtime
        uses: actions/download-artifact@v4
        with:
          name: runtime-assets-dropbear
          path: build/artifacts/1.19/rx3-ssh

      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Test portable build engine
        run: python -m unittest discover -s tests -p test_mod_generator.py

      - name: Test separation engine
        run: python -m unittest discover -s tests -p test_stem_studio.py

      - name: Test desktop application sources
        run: python apps/rx3-toolbox/main.py --self-test

      - name: Build desktop application
        env:
          RX3_PREBUILT_HOOK: ${{ github.workspace }}/prebuilt/librx3_core.so
        run: pyinstaller --noconfirm --clean apps/rx3-toolbox/rx3_toolbox.spec

      - name: Check packaged macOS libraries
        if: runner.os == 'macOS'
        run: python scripts/check_macos_bundle.py "${{ matrix.target }}"

      - name: Smoke-test packaged application
        run: python scripts/smoke_desktop_app.py "${{ matrix.executable }}"

      - name: Package release
        run: >-
          python scripts/package_release.py
          "${{ matrix.target }}"
          "release/${{ matrix.archive }}"
          --include LICENSE
          --include THIRD_PARTY_NOTICES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-app

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xdj-rx3-toolkit-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print

      # The changelog is where the release is described in the first place, so
      # the published notes are that section rather than a second account of it.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## $version" '
            $0 == want { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create
          "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --notes-file notes.md
          --title "XDJ-RX3 Toolkit ${GITHUB_REF_NAME}"
