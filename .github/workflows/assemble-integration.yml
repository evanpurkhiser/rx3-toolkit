# SPDX-License-Identifier: MPL-2.0

name: Assemble integration branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assemble-evanpurkhiser-integration
  cancel-in-progress: true

jobs:
  assemble:
    name: Rebuild Evan's RX3 integration
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld file ffmpeg
          python -m pip install -r requirements.txt

      - name: Assemble, validate, and publish branches
        run: scripts/assemble-branches.sh --validate --push
